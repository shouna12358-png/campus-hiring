openapi: 3.1.0
info:
  title: 校园招聘数据接口
  description: 自定义 GPT 读取校园招聘数据的接口（静态 JSON 起步版，字段对应「招聘信息源.csv」）。
  version: 1.0.0
servers:
  - url: https://shouna12358-png.github.io/campus-hiring
paths:
  /campus-hiring.json:
    get:
      operationId: getCampusHiringData
      summary: 获取全部校园招聘数据
      description: >-
        返回招聘信息源每日导出的招聘数据，包含 items 数组。
        GPT 在回答用户关于秋招/实习/校招、公司、行业、城市的问题时调用此接口。
      responses:
        '200':
          description: 招聘数据列表（含元信息与 items 数组）
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedAt:
                    type: string
                    description: 数据导出时间，ISO8601
                    example: "2026-08-12T22:14:12+08:00"
                  count:
                    type: integer
                    description: 条目总数
                    example: 3312
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "7c10d2445871"
                        company:
                          type: string
                          example: "IEF爱依服"
                        updatedAt:
                          type: string
                          example: "2026-08-12"
                        openAt:
                          type: string
                          description: 开招时间，保留源表中的时间文本
                          example: "2026/8/20 10:04"
                        deadline:
                          type: string
                          description: 截止时间，可能是日期或「招满为止」
                          example: "招满为止"
                        type:
                          type: string
                          description: 招聘类型：秋招/实习/校招/秋招提前批/社招等
                          example: "秋招"
                        typeTags:
                          type: array
                          description: 招聘类型拆分后的标准标签
                          items:
                            type: string
                          example: ["秋招", "实习"]
                        tags:
                          type: array
                          description: 源表“标签”列拆分后的标签列表
                          items:
                            type: string
                          example: ["hot", "超多hc"]
                        targetCohort:
                          type: string
                          description: 面向人群，如 2027届
                          example: "2027届"
                        companyType:
                          type: string
                          description: 公司性质：国企/央企/私企/外企/事业单位等
                          example: "私企"
                        industry:
                          type: string
                          description: 行业归类
                          example: "消费"
                        positions:
                          type: string
                          description: 招聘岗位提取
                          example: "货品管理岗,服装设计岗,商品运营岗,储备店长岗"
                        city:
                          type: string
                          example: "佛山"
                        announcementUrl:
                          type: string
                          example: "https://mp.weixin.qq.com/s/ZrS20TsegWbUM1wYlYnpiQ"
                        applyUrl:
                          type: string
                          example: "https://ief.hotjob.cn/"
                        status:
                          type: string
                          example: "待投递"
                required:
                  - updatedAt
                  - count
                  - items
